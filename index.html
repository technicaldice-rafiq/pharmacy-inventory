<!DOCTYPE html>
<html lang="bn">
<head> <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f766e">
  <title>Pharmacy Inventory Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      color: #1f2937;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 250px;
      background: #0f766e;
      color: white;
      padding: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 30px;
    }

    .brand-icon {
      font-size: 32px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: bold;
    }

    .brand-subtitle {
      font-size: 12px;
      opacity: .8;
      margin-top: 3px;
    }

    .nav-btn {
      width: 100%;
      border: none;
      background: transparent;
      color: white;
      text-align: left;
      padding: 13px;
      margin: 3px 0;
      border-radius: 9px;
      font-size: 15px;
      cursor: pointer;
    }

    .nav-btn:hover,
    .nav-btn.active {
      background: rgba(255,255,255,.18);
    }

    main {
      margin-left: 250px;
    }

    header {
      background: white;
      padding: 18px 25px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 4px 0 0;
      color: #6b7280;
      font-size: 13px;
    }

    .date {
      margin-left: auto;
      color: #6b7280;
    }

    .menu {
      display: none;
      border: none;
      background: #e5e7eb;
      padding: 8px 11px;
      border-radius: 8px;
      font-size: 20px;
    }

    .content {
      padding: 25px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .card-icon {
      font-size: 28px;
    }

    .card-title {
      color: #6b7280;
      margin-top: 8px;
      font-size: 14px;
    }

    .card-value {
      font-size: 25px;
      font-weight: bold;
      margin-top: 7px;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px;
      margin-top: 18px;
    }

    .panel {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(0,0,0,.04);
    }

    .panel h3 {
      margin-top: 0;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .quick-btn {
      border: none;
      background: #0f766e;
      color: white;
      padding: 13px;
      border-radius: 9px;
      cursor: pointer;
    }

    .quick-btn:hover {
      opacity: .9;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #777;
    }

    @media(max-width: 800px) {

      .sidebar {
        transform: translateX(-100%);
        transition: .2s;
        z-index: 10;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      main {
        margin-left: 0;
      }

      .menu {
        display: block;
      }

      .cards {
        grid-template-columns: 1fr 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .date {
        display: none;
      }
    }

    @media(max-width: 450px) {

      .cards {
        grid-template-columns: 1fr;
      }

      .content {
        padding: 15px;
      }
    }
  </style>
</head>

<body>

  <!-- Sidebar -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="brand-icon">💊</div>

      <div>
        <div class="brand-title">
          Pharmacy
        </div>

        <div class="brand-subtitle">
          Inventory Pro
        </div>
      </div>
    </div>

    <button class="nav-btn active" onclick="showDashboard()">
      📊 Dashboard
    </button>

    <button class="nav-btn" onclick="comingSoon('Medicines')">
      💊 Medicines
    </button>

    <button class="nav-btn" onclick="comingSoon('Purchase')">
      📦 Purchase
    </button>

    <button class="nav-btn" onclick="comingSoon('Sales / POS')">
      🧾 Sales / POS
    </button>

    <button class="nav-btn" onclick="comingSoon('Suppliers')">
      🚚 Suppliers
    </button>

    <button class="nav-btn" onclick="comingSoon('Customers')">
      👤 Customers
    </button>

    <button class="nav-btn" onclick="comingSoon('Reports')">
      📈 Reports
    </button>

    <button class="nav-btn" onclick="comingSoon('Settings')">
      ⚙️ Settings
    </button>

  </aside>


  <!-- Main -->

  <main>

    <header>

      <button class="menu" onclick="toggleMenu()">
        ☰
      </button>

      <div>

        <h1 id="pageTitle">
          Dashboard
        </h1>

        <p>
          Pharmacy Stock & Inventory Management
        </p>

      </div>

      <div class="date" id="today"></div>

    </header>


    <section class="content" id="content">

      <div class="cards">

        <div class="card">

          <div class="card-icon">
            💰
          </div>

          <div class="card-title">
            Today's Sales
          </div>

          <div class="card-value">
            ৳ 0
          </div>

        </div>


        <div class="card">

          <div class="card-icon">
            📦
          </div>

          <div class="card-title">
            Total Stock
          </div>

          <div class="card-value">
            0
          </div>

        </div>


        <div class="card">

          <div class="card-icon">
            ⚠️
          </div>

          <div class="card-title">
            Low Stock
          </div>

          <div class="card-value">
            0
          </div>

        </div>


        <div class="card">

          <div class="card-icon">
            📅
          </div>

          <div class="card-title">
            Near Expiry
          </div>

          <div class="card-value">
            0
          </div>

        </div>

      </div>


      <div class="grid">

        <div class="panel">

          <h3>
            🧾 Recent Sales
          </h3>

          <div class="empty">
            এখনো কোনো বিক্রয় তথ্য নেই।
          </div>

        </div>


        <div class="panel">

          <h3>
            ⚡ Quick Actions
          </h3>

          <div class="quick-actions">

            <button class="quick-btn"
                    onclick="comingSoon('New Sale')">
              New Sale
            </button>

            <button class="quick-btn"
                    onclick="comingSoon('Add Purchase')">
              Add Purchase
            </button>

            <button class="quick-btn"
                    onclick="comingSoon('Add Medicine')">
              Add Medicine
            </button>

            <button class="quick-btn"
                    onclick="comingSoon('Reports')">
              Reports
            </button>

          </div>

        </div>

      </div>

    </section>

  </main>


  <script>

    // Today's date

    document.getElementById("today").innerText =
      new Date().toLocaleDateString(
        "en-BD",
        {
          day: "numeric",
          month: "short",
          year: "numeric"
        }
      );


    // Mobile menu

    function toggleMenu() {

      document
        .getElementById("sidebar")
        .classList
        .toggle("open");

    }


    // Dashboard

    function showDashboard() {

      document.getElementById("pageTitle").innerText =
        "Dashboard";

    }


    // Temporary page message

    function comingSoon(name) {

      alert(
        name +
        " module আমরা পরের ধাপে চালু করব।"
      );

    }

  </script>

</body>
</html>
